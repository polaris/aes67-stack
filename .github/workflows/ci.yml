name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [host-debug, host-asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-rt-18-dev

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  mcu-check:
    name: mcu-check (Cortex-M7)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build core for Cortex-M7
        run: cmake --workflow --preset mcu-check

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          files=$(git ls-files '*.c' '*.h')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi
